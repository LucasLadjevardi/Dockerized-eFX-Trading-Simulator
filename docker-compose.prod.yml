services:
  frontend:
    image: ghcr.io/LUCASLADJEVARDI/efx-simulator-frontend:latest
    ports:
      - "3000:8080"
    depends_on:
      - backend

  backend:
    image: ghcr.io/LUCASLADJEVARDI/efx-simulator-backend:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Redis__ConnectionString: "redis:6379"
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"